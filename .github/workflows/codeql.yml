name: CodeQL Security Analysis

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze Java and Kotlin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install font tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge

      - name: Prepare build environment
        run: |
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew
          sdkmanager "ndk;27.2.12479018"

      - name: Build native dictionary libraries
        run: |
          "$ANDROID_HOME/ndk/27.2.12479018/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=vendor/Android.mk \
            APP_ABI="arm64-v8a x86_64" \
            APP_PLATFORM=android-21 \
            NDK_LIBS_OUT=libs
          test -f libs/arm64-v8a/libcdict_java.so
          test -f libs/x86_64/libcdict_java.so

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build project for CodeQL
        run: ./gradlew assembleDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
