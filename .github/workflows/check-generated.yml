name: Check generated files

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  gen-layouts:
    name: Layout list
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - run: python3 gen_layouts.py
    - name: "Run 'python3 gen_layouts.py' to update the generated files."
      run: git diff --exit-code

  check-layouts:
    name: Layout warnings
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - run: python3 check_layout.py
    - name: "Fix your layout accordingly or run 'python3 check_layout.py' to promote the warnings"
      run: git diff --exit-code

  check-compose:
    name: Compose key data
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - run: python3 srcs/compose/compile.py srcs/compose/{*.json,compose} > srcs/java/juloo/keyboard2/ComposeKeyData.java
    - name: "Run 'gradle test' to update the generated files."
      run: git diff --exit-code

  check-method:
    name: method.xml
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - run: python3 gen_method_xml.py > res/xml/method.xml
    - name: "Run 'gradle test' to update the generated files."
      run: git diff --exit-code

  sinhala-layout:
    name: Sinhala layout generator and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Sinhala layout generator
        run: python3 -m unittest discover -s test/sinhala -p 'test_*.py'
      - name: Verify generated Sinhala layout is up to date
        run: |
          python3 gen_sinhala_phonetic_layout.py
          git diff --exit-code -- srcs/layouts/sinhala_phonetic.xml
