name: Build and release signed APK

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build Unexpected Keyboard APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools (fontforge)
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge

      - name: Prepare environment for runner
        run: |
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew

      - name: Prepare ephemeral debug signing key
        run: |
          debug_password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt \
            -dname "cn=Debug Build" \
            -alias debug \
            -keypass "$debug_password" \
            -keystore debug.keystore \
            -keyalg RSA \
            -storepass "$debug_password" \
            -validity 1
          {
            echo "DEBUG_KEYSTORE_PASSWORD=$debug_password"
            echo "DEBUG_KEY_PASSWORD=$debug_password"
          } >> "$GITHUB_ENV"

      - name: Prepare release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret"
            exit 1
          fi
          if [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing RELEASE_KEYSTORE_PASSWORD secret"
            exit 1
          fi
          if [ -z "$RELEASE_KEY_ALIAS" ]; then
            echo "::error::Missing RELEASE_KEY_ALIAS secret"
            exit 1
          fi
          if [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Missing RELEASE_KEY_PASSWORD secret"
            exit 1
          fi
          release_keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$release_keystore"
          chmod 600 "$release_keystore"
          echo "RELEASE_KEYSTORE=$release_keystore" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew test

      - name: Build signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: unexpected-keyboard-release
          path: build/outputs/apk/release/Unexpected-Keyboard-release.apk
          retention-days: 7

      - name: Remove release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  release:
    name: Publish signed GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: unexpected-keyboard-release
          path: dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/Unexpected-Keyboard-release.apk
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
