name: Build and release APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - "v*"

jobs:
  build:
    name: Build Unexpected Keyboard APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools (fontforge)
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge

      - name: Prepare environment for runner
        run: |
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew

      - name: Prepare ephemeral debug signing key
        run: |
          debug_password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt \
            -dname "cn=Debug Build" \
            -alias debug \
            -keypass "$debug_password" \
            -keystore debug.keystore \
            -keyalg RSA \
            -storepass "$debug_password" \
            -validity 1
          {
            echo "DEBUG_KEYSTORE_PASSWORD=$debug_password"
            echo "DEBUG_KEY_PASSWORD=$debug_password"
          } >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: unexpected-keyboard-debug
          path: build/outputs/apk/debug/Unexpected-Keyboard-debug.apk
          retention-days: 30

  release:
    name: Publish GitHub release
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: unexpected-keyboard-debug
          path: dist

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Unexpected Keyboard - Sinhala Edition (Latest Build)"
          body: |
            ### Unexpected Keyboard - Sinhala Edition

            **නවතම APK එක මෙතැනින් download කරගන්න:**
            - [Unexpected-Keyboard-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/Unexpected-Keyboard-debug.apk)

            - Singlish to Sinhala transliteration
            - Static next-word suggestions for a limited set of common Sinhala phrases
            - Haptic feedback on supported devices
          files: dist/Unexpected-Keyboard-debug.apk
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
