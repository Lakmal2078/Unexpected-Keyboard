name: Android CI and Device Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check keyboard theme contrast
        run: python3 check_theme_contrast.py

      - name: Install build tools (fontforge)
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge

      - name: Prepare environment for runner
        run: |
          sed -i '/android.aapt2FromMavenOverride/d' gradle.properties || true
          chmod +x gradlew

      - name: Prepare ephemeral debug signing key
        run: |
          debug_password="$(openssl rand -hex 24)"
          keytool -genkeypair -noprompt \
            -dname "cn=Debug Build" \
            -alias debug \
            -keypass "$debug_password" \
            -keystore debug.keystore \
            -keyalg RSA \
            -storepass "$debug_password" \
            -validity 1
          {
            echo "DEBUG_KEYSTORE_PASSWORD=$debug_password"
            echo "DEBUG_KEY_PASSWORD=$debug_password"
          } >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew test

      - name: Enable KVM access for the emulator
        run: |
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run Android UI and device tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          script: ./gradlew connectedDebugAndroidTest

      - name: Collect theme picker screenshots
        if: always()
        run: |
          mkdir -p build/uiux-screenshots
          adb pull /sdcard/Android/data/juloo.keyboard2.debug/files/Pictures/unexpected-keyboard-uiux/. build/uiux-screenshots/ || true

      - name: Upload theme picker screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unexpected-keyboard-theme-picker-screenshots
          path: build/uiux-screenshots/
          if-no-files-found: ignore
          retention-days: 30

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: unexpected-keyboard-debug-pr
          path: build/outputs/apk/debug/Unexpected-Keyboard-debug.apk
          retention-days: 7
